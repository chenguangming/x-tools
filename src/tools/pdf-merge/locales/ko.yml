tools:
  pdf-merge:
    title: PDF 병합
    description: 여러 PDF를 원하는 순서로 하나로 합칩니다. 모든 처리는 브라우저에서 이뤄지며 업로드되지 않습니다.
    upload: PDF 파일을 여기에 끌어다 놓거나 클릭하여 선택
    notAPdf: PDF 파일이 아닙니다.
    openFailed: 이 파일을 열 수 없습니다(손상되었거나 암호로 보호됨).
    pages: '{count}페이지'
    summary: '{files}개 파일, 총 {pages}페이지'
    dragHint: ⠿ 를 끌어 순서 변경
    merge: 병합 후 다운로드
    working: 병합 중…
    clear: 모두 지우기
    needTwo: PDF 파일을 두 개 이상 추가하세요.
    done: 병합되었습니다. 파일이 다운로드되었습니다.
    failed: 병합에 실패했습니다. 파일을 확인해 주세요.
