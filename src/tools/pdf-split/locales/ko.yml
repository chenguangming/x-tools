tools:
  pdf-split:
    title: PDF 분할
    description: 브라우저에서 PDF의 특정 페이지를 추출하거나 여러 파일로 나눕니다. 업로드되지 않습니다.
    upload: PDF를 여기에 끌어다 놓거나 클릭하여 선택
    notAPdf: PDF 파일을 선택하세요.
    openFailed: 이 파일을 열 수 없습니다(손상되었거나 암호로 보호됨).
    pages: '{count}페이지'
    modeExtract: 지정한 페이지를 하나의 PDF로 추출
    modeEach: 페이지마다 개별 PDF로
    modeChunk: N페이지마다 분할
    rangePlaceholder: '예: 1-3, 5, 8-(총 {total}페이지)'
    rangeHint: '여러 페이지는 쉼표, 범위는 하이픈으로 입력하세요. 8- 은 8페이지부터 끝까지입니다.'
    invalidRange: '페이지 범위가 올바르지 않습니다. 1부터 {total} 사이여야 합니다.'
    every: ''
    pagesUnit: 페이지마다
    zipHint: 개별 PDF는 .zip 파일로 묶여 다운로드됩니다.
    split: 분할 후 다운로드
    working: 처리 중…
    chooseAnother: 다른 PDF 선택
    failed: 분할에 실패했습니다. 다른 PDF로 시도해 주세요.
