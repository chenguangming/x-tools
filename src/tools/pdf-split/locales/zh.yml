tools:
  pdf-split:
    title: PDF 拆分
    description: 在浏览器里提取 PDF 的指定页面，或把 PDF 拆成多个文件。文件不会上传。
    upload: 把 PDF 拖到这里，或点击选择
    notAPdf: 请选择 PDF 文件。
    openFailed: 无法打开这个文件（已损坏或有密码保护）。
    pages: '共 {count} 页'
