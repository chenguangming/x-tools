tools:
  pdf-split:
    title: PDF 拆分
    description: 在瀏覽器裡擷取 PDF 的指定頁面，或把 PDF 拆成多個檔案。檔案不會上傳。
    upload: 把 PDF 拖到這裡，或點擊選擇
    notAPdf: 請選擇 PDF 檔案。
    openFailed: 無法開啟這個檔案（已損壞或有密碼保護）。
    pages: '共 {count} 頁'
    modeExtract: 擷取指定頁面為一個 PDF
    modeEach: 每一頁拆成單獨的 PDF
    modeChunk: 每 N 頁拆成一個 PDF
    rangePlaceholder: '例如 1-3, 5, 8-（共 {total} 頁）'
    rangeHint: 多個頁碼用逗號分隔，範圍用短橫線。8- 表示第 8 頁到最後一頁。
    invalidRange: '頁碼範圍無效，頁碼需在 1 到 {total} 之間。'
    every: 每
    pagesUnit: 頁
    zipHint: 拆分出的多個 PDF 會打包成 .zip 一起下載。
    split: 拆分並下載
    working: 處理中…
    chooseAnother: 更換 PDF
    failed: 拆分失敗，請換一個 PDF 再試。
