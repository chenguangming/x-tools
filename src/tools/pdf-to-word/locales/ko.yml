tools:
  pdf-to-word:
    title: PDF를 Word로 변환
    description: 브라우저에서 PDF를 편집 가능한 Word(.docx) 파일로 변환합니다. 스캔 PDF는 OCR로 인식할 수 있으며 파일은 업로드되지 않습니다.
    upload: PDF를 여기에 끌어다 놓거나 클릭하여 선택
    notAPdf: PDF 파일을 선택하세요.
    encrypted: 이 PDF는 암호로 보호되어 열 수 없습니다.
    openFailed: 이 PDF를 열 수 없습니다.
    pages: '{count}페이지'
    ocrScanned: 스캔한 페이지의 글자 인식(OCR)
    convert: Word로 변환
    working: 변환 중…
    cancel: 취소
    chooseAnother: 다른 PDF 선택
    downloadAgain: 다시 다운로드
    loadingEngine: OCR 엔진 로딩 중(처음 한 번만)…
    readPage: '{page} / {total} 페이지 읽는 중…'
    ocrPage: '{page} / {total} 페이지 인식 중…'
    building: Word 파일 생성 중…
    failed: 변환에 실패했습니다. 다른 PDF로 시도해 주세요.
    done: 완료되었습니다. Word 파일이 다운로드되었습니다.
    ocrDone: '스캔된 {count}페이지를 OCR로 인식했습니다.'
    emptyPages: '{count}페이지에서 글자를 인식하지 못했습니다.'
    hint: '글자, 문단, 제목은 유지되지만 이미지, 표, 복잡한 레이아웃은 유지되지 않습니다. 변환 후 Word에서 정리가 필요할 수 있습니다.'
