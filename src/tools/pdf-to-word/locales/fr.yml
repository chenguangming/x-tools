    convert: Convertir en Word
    working: Conversion…
    cancel: Annuler
    chooseAnother: Choisir un autre PDF
    downloadAgain: Télécharger à nouveau
    loadingEngine: Chargement du moteur OCR (première utilisation uniquement)…
    readPage: 'Lecture de la page {page} / {total}…'
    ocrPage: 'Reconnaissance de la page {page} / {total}…'
    building: Création du fichier Word…
