tools:
  pdf-to-word:
    title: PDF у Word
    description: Перетворює PDF на редагований файл Word (.docx) просто в браузері. Скановані PDF можна розпізнати через OCR. Нічого не завантажується на сервер.
    upload: 'Перетягніть PDF сюди або натисніть, щоб вибрати'
    notAPdf: Виберіть файл PDF.
    encrypted: Цей PDF захищений паролем і не може бути відкритий.
    openFailed: Не вдалося відкрити цей PDF.
    pages: 'Сторінок: {count}'
    ocrScanned: Розпізнавати текст на сканованих сторінках (OCR)
    convert: Перетворити на Word
    working: Перетворення…
    cancel: Скасувати
    chooseAnother: Вибрати інший PDF
    downloadAgain: Завантажити ще раз
    loadingEngine: Завантаження рушія OCR (лише вперше)…
    readPage: 'Читання сторінки {page} / {total}…'
    ocrPage: 'Розпізнавання сторінки {page} / {total}…'
    building: Створення файлу Word…
    failed: Не вдалося перетворити. Спробуйте інший PDF.
    done: Готово. Файл Word завантажено.
    ocrDone: 'Сканованих сторінок, розпізнаних через OCR: {count}.'
    emptyPages: 'Сторінок без розпізнаваного тексту: {count}.'
    hint: 'Текст, абзаци й заголовки зберігаються; зображення, таблиці та складне форматування — ні. Результат може знадобитися доопрацювати у Word.'
