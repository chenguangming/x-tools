tools:
  image-to-text:
    title: 画像からテキスト（OCR）
    description: スクリーンショットや写真の文字をブラウザ上で認識します。中国語・英語・日本語・韓国語に対応し、画像はアップロードされません。
    upload: 画像をここにドロップ、またはクリックして選択
    pasteHint: 'Ctrl+V でスクリーンショットを貼り付けることもできます。'
    notAnImage: 画像ファイルを選択してください。
    recognize: 文字を認識
    working: 認識中…
    chooseAnother: 画像を変更
    loadingEngine: 認識エンジンを読み込み中（初回のみ）…
    recognizing: '認識中… {percent}%'
    hint: 鮮明で正立した印刷文字に最適です。手書きやぼやけた写真は精度が下がる場合があります。
    resultPlaceholder: 認識した文字がここに表示されます。編集もできます。
    noText: 画像から文字が見つかりませんでした。
    failed: 認識に失敗しました。別の画像をお試しください。
    copy: コピー
    copied: クリップボードにコピーしました
    downloadTxt: .txt で保存
