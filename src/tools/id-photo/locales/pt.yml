tools:
  id-photo:
    title: Criador de foto para documentos
    description: Corte retratos para os tamanhos comuns de foto de documento, passaporte ou visto, escolha a cor de fundo (branco, azul, vermelho…) e exporte em JPG ou PNG, com limite opcional de tamanho de arquivo.
    upload: Arraste um retrato para aqui ou clique para selecionar
    notAnImage: Selecione um arquivo de imagem.
    cropFailed: Falha ao gerar a foto.
    sizeLimitNotReached: 'Não foi possível ficar abaixo de {size} KB sem perder muita qualidade. Use um tamanho menor ou um limite maior.'
    size: Tamanho da foto
    background: Cor de fundo
    format: Formato
    maxSize: Tamanho máximo do arquivo
    noLimit: Sem limite
    preview: Pré-visualizar
    save: Salvar foto
    rotateLeft: Girar à esquerda
    rotateRight: Girar à direita
    zoomIn: Aumentar zoom
    zoomOut: Diminuir zoom
    reset: Redefinir
    chooseAnother: Escolher outra foto
    hint: Arraste a foto para posicionar o rosto dentro da moldura e role para dar zoom. As áreas fora da foto são preenchidas com a cor de fundo.
    replaceBackground: Substituir fundo
    replaceBackgroundHint: Recorta a pessoa automaticamente e a coloca sobre a cor escolhida. O modelo (cerca de 26 MB) é descarregado na primeira utilização e corre totalmente no navegador.
    sizeHint: Escolher um tamanho só altera a proporção da caixa de recorte no editor; o tamanho real em píxeis aplica-se na exportação.
    adjust: Ajuste de cor
    brightness: Brilho
    contrast: Contraste
    saturation: Saturação
    resetAdjust: Repor
    loadingModel: A carregar o modelo de recorte…
    downloadingModel: 'A transferir o modelo de recorte… {percent}%'
    matteFailed: Falha ao remover o fundo. Desative «Substituir fundo» ou experimente outra foto.
    presets:
      oneInch: 1 polegada
      smallOneInch: 1 polegada pequena
      bigOneInch: 1 polegada grande
      twoInch: 2 polegadas
      smallTwoInch: 2 polegadas pequena (passaporte/visto)
      bigTwoInch: 2 polegadas grande
      square2in: Passaporte/visto EUA (2×2 pol)
      custom: Tamanho personalizado…
    colors:
      white: Branco
      blue: Azul
      red: Vermelho
      gray: Cinza claro
