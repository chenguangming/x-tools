tools:
  id-photo:
    title: Фото на документи
    description: Обрізайте портрети до поширених розмірів фото на документи, паспорт чи візу, обирайте колір тла (білий, синій, червоний…) та експортуйте у JPG або PNG, за потреби з обмеженням розміру файлу.
    upload: Перетягніть портрет сюди або натисніть, щоб вибрати
    notAnImage: Виберіть файл зображення.
    cropFailed: Не вдалося створити фото.
    sizeLimitNotReached: 'Не вдалося зменшити розмір нижче {size} КБ без значної втрати якості. Скористайтеся меншим розміром або вищим обмеженням.'
    size: Розмір фото
    background: Колір тла
    format: Формат
    maxSize: Макс. розмір файлу
    noLimit: Без обмежень
    preview: Попередній перегляд
    save: Зберегти фото
    rotateLeft: Повернути ліворуч
    rotateRight: Повернути праворуч
    zoomIn: Збільшити
    zoomOut: Зменшити
    reset: Скинути
    chooseAnother: Вибрати інше фото
    hint: 'Перетягуйте фото, щоб розмістити обличчя в рамці, прокручуйте для масштабування. Області поза фото заповнюються кольором тла.'
    replaceBackground: Замінити тло
    replaceBackgroundHint: Автоматично вирізає людину та поміщає на вибраний колір. Модель (близько 26 МБ) завантажується під час першого використання й працює повністю у браузері.
    sizeHint: Вибір розміру в редакторі змінює лише пропорції рамки обрізання; фактичний розмір у пікселях застосовується під час експорту.
    adjust: Корекція кольору
    brightness: Яскравість
    contrast: Контраст
    saturation: Насиченість
    resetAdjust: Скинути
    loadingModel: Завантаження моделі вирізання…
    downloadingModel: 'Завантаження моделі вирізання… {percent}%'
    matteFailed: Не вдалося видалити тло. Вимкніть «Замінити тло» або спробуйте інше фото.
    presets:
      oneInch: 1 дюйм
      smallOneInch: Малий 1 дюйм
      bigOneInch: Великий 1 дюйм
      twoInch: 2 дюйми
      smallTwoInch: Малий 2 дюйми (паспорт/віза)
      bigTwoInch: Великі 2 дюйми
      square2in: Паспорт/віза США (2×2 дюйми)
      custom: Власний розмір…
    colors:
      white: Білий
      blue: Синій
      red: Червоний
      gray: Світло-сірий
