tools:
  id-photo:
    title: 증명사진 만들기
    description: 인물 사진을 일반 증명사진·여권·비자 규격으로 자르고, 배경색(흰색, 파란색, 빨간색 등)을 선택해 JPG 또는 PNG로 내보냅니다. 파일 크기 제한도 지정할 수 있습니다.
    upload: 인물 사진을 여기에 끌어다 놓거나 클릭하여 선택하세요
    notAnImage: 이미지 파일을 선택해 주세요.
    cropFailed: 사진을 만들지 못했습니다.
    sizeLimitNotReached: '화질을 크게 해치지 않고는 {size} KB 이하로 줄일 수 없습니다. 더 작은 크기나 더 큰 제한을 사용하세요.'
    size: 사진 크기
    background: 배경색
    format: 형식
    maxSize: 최대 파일 크기
    noLimit: 제한 없음
    preview: 미리보기
    save: 사진 저장
    rotateLeft: 왼쪽으로 회전
    rotateRight: 오른쪽으로 회전
    zoomIn: 확대
    zoomOut: 축소
    reset: 초기화
    chooseAnother: 다른 사진 선택
    hint: 사진을 끌어 얼굴을 틀 안에 맞추고 스크롤로 확대/축소하세요. 사진 밖 영역은 배경색으로 채워집니다.
    replaceBackground: 배경 바꾸기
    replaceBackgroundHint: '인물을 자동으로 분리해 선택한 배경색 위에 합성합니다. 처음 사용할 때 약 26 MB 모델을 내려받으며, 모든 처리는 브라우저 안에서 이루어집니다.'
    sizeHint: 규격을 선택해도 편집 화면에서는 자르기 상자의 비율만 바뀝니다. 실제 픽셀 크기는 내보낼 때 적용됩니다.
    adjust: 색상 조정
    brightness: 밝기
    contrast: 대비
    saturation: 채도
    resetAdjust: 초기화
    cancel: 취소
    download: 다운로드
    loadingModel: 누끼 모델을 불러오는 중…
    downloadingModel: '누끼 모델 다운로드 중… {percent}%'
    matteFailed: '배경 제거에 실패했습니다. "배경 바꾸기"를 끄거나 다른 사진을 사용해 보세요.'
    presets:
      oneInch: 1인치
      smallOneInch: 작은 1인치
      bigOneInch: 큰 1인치
      twoInch: 2인치
      smallTwoInch: 작은 2인치(여권/비자)
      bigTwoInch: 큰 2인치
      square2in: 미국 여권/비자(2×2인치)
      custom: 사용자 지정 크기…
    colors:
      white: 흰색
      blue: 파란색
      red: 빨간색
      gray: 연회색
