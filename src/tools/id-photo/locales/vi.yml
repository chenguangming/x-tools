tools:
  id-photo:
    title: Tạo ảnh thẻ
    description: Cắt ảnh chân dung theo kích thước ảnh thẻ, hộ chiếu, visa phổ biến, chọn màu nền (trắng, xanh, đỏ…) và xuất JPG hoặc PNG, có thể giới hạn dung lượng tệp.
    upload: Kéo thả ảnh chân dung vào đây hoặc nhấp để chọn
    notAnImage: Vui lòng chọn một tệp ảnh.
    cropFailed: Không thể tạo ảnh.
    sizeLimitNotReached: 'Không thể giảm xuống dưới {size} KB mà không làm giảm chất lượng quá nhiều. Hãy dùng kích thước nhỏ hơn hoặc giới hạn cao hơn.'
    size: Kích thước ảnh
    background: Màu nền
    format: Định dạng
    maxSize: Dung lượng tối đa
    noLimit: Không giới hạn
    preview: Xem trước
    save: Lưu ảnh
    rotateLeft: Xoay trái
    rotateRight: Xoay phải
    zoomIn: Phóng to
    zoomOut: Thu nhỏ
    reset: Đặt lại
    chooseAnother: Chọn ảnh khác
    hint: Kéo ảnh để đặt khuôn mặt vào khung và cuộn để thu phóng. Vùng ngoài ảnh sẽ được lấp bằng màu nền.
    replaceBackground: Thay nền
    replaceBackgroundHint: Tự động tách người ra và đặt lên màu đã chọn. Mô hình (khoảng 26 MB) được tải khi dùng lần đầu và chạy hoàn toàn trong trình duyệt.
    sizeHint: Chọn cỡ ảnh chỉ đổi tỉ lệ khung cắt trong trình chỉnh sửa; kích thước điểm ảnh thực tế được áp dụng khi xuất.
    adjust: Chỉnh màu
    brightness: Độ sáng
    contrast: Độ tương phản
    saturation: Độ bão hòa
    resetAdjust: Đặt lại
    cancel: Hủy
    download: Tải xuống
    loadingModel: Đang tải mô hình tách nền…
    downloadingModel: 'Đang tải mô hình tách nền… {percent}%'
    matteFailed: 'Tách nền thất bại. Hãy tắt "Thay nền" hoặc thử ảnh khác.'
    presets:
      oneInch: 1 inch
      smallOneInch: 1 inch nhỏ
      bigOneInch: 1 inch lớn
      twoInch: 2 inch
      smallTwoInch: 2 inch nhỏ (hộ chiếu/visa)
      bigTwoInch: 2 inch lớn
      square2in: Hộ chiếu/visa Mỹ (2×2 in)
      custom: Kích thước tùy chỉnh…
    colors:
      white: Trắng
      blue: Xanh
      red: Đỏ
      gray: Xám nhạt
