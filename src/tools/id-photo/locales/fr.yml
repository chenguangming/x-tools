tools:
  id-photo:
    title: Créateur de photo d'identité
    description: Recadrez un portrait aux formats courants de photo d'identité, passeport ou visa, choisissez la couleur de fond (blanc, bleu, rouge…) et exportez en JPG ou PNG, avec une limite de taille de fichier optionnelle.
    upload: Glissez-déposez un portrait ici ou cliquez pour en sélectionner un
    notAnImage: Veuillez sélectionner un fichier image.
    cropFailed: Échec de la génération de la photo.
    sizeLimitNotReached: 'Impossible de descendre sous {size} Ko sans trop perdre en qualité. Utilisez une taille plus petite ou une limite plus haute.'
    size: Taille de la photo
    background: Couleur de fond
    format: Format
    maxSize: Taille maximale du fichier
    noLimit: Sans limite
    preview: Aperçu
    save: Enregistrer la photo
    rotateLeft: Pivoter à gauche
    rotateRight: Pivoter à droite
    zoomIn: Zoom avant
    zoomOut: Zoom arrière
    reset: Réinitialiser
    chooseAnother: Choisir une autre photo
    hint: Faites glisser la photo pour placer le visage dans le cadre et utilisez la molette pour zoomer. Les zones hors de la photo sont remplies avec la couleur de fond.
    replaceBackground: Remplacer le fond
    replaceBackgroundHint: 'Détoure automatiquement la personne et la place sur la couleur choisie. Le modèle (environ 26 Mo) est téléchargé à la première utilisation et s''exécute entièrement dans votre navigateur.'
    sizeHint: 'Choisir une taille ne modifie que le ratio du cadre dans l''éditeur ; la taille réelle en pixels s''applique à l''export.'
    adjust: Réglage des couleurs
    brightness: Luminosité
    contrast: Contraste
    saturation: Saturation
    resetAdjust: Réinitialiser
    loadingModel: Chargement du modèle de détourage…
    downloadingModel: 'Téléchargement du modèle de détourage… {percent} %'
    matteFailed: Échec de la suppression du fond. Désactivez « Remplacer le fond » ou essayez une autre photo.
    presets:
      oneInch: 1 pouce
      smallOneInch: Petit 1 pouce
      bigOneInch: Grand 1 pouce
      twoInch: 2 pouces
      smallTwoInch: Petit 2 pouces (passeport/visa)
      bigTwoInch: Grand 2 pouces
      square2in: Passeport/visa US (2×2 po)
      custom: Taille personnalisée…
    colors:
      white: Blanc
      blue: Bleu
      red: Rouge
      gray: Gris clair
