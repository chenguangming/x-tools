tools:
  image-cropper:
    title: 画像トリミング
    description: 指定した比率やサイズ（または自由）で画像をトリミングし、背景色を変更して PNG・JPG・WebP に変換して保存します。
    upload: 画像をここにドラッグ＆ドロップするか、クリックして選択
    notAnImage: 画像ファイルを選択してください。
    formatUnsupported: お使いのブラウザはこの形式でのエンコードに対応していません。別の形式を選んでください。
    cropFailed: 画像のトリミングに失敗しました。
    ratio: 縦横比
    ratioFree: 自由
    outputSize: 出力サイズ（px）
    auto: 自動
    background: 背景
    transparent: 透明
    solidColor: 単色
    jpgNoAlpha: JPG は透明に対応していないため、空白部分は白で塗りつぶされます。
    format: 形式
    quality: 品質
    preview: プレビュー
    saveAs: '{format} で保存'
    rotateLeft: 左に回転
    rotateRight: 右に回転
    zoomIn: 拡大
    zoomOut: 縮小
    reset: リセット
    chooseAnother: 別の画像を選択
    hint: 画像をドラッグして移動、スクロールでズーム、トリミング枠やその角をドラッグして範囲を調整できます。画像の外側は背景色で塗りつぶされます。
    removeBackground: 背景を削除
    removeBackgroundHint: 人物を自動で切り抜きます（人物写真向け）。結果は下の背景設定が適用されます。初回のみ約 26 MB のモデルをダウンロードし、処理はすべてブラウザ内で行われます。
    loadingModel: 切り抜きモデルを読み込み中…
    downloadingModel: '切り抜きモデルをダウンロード中… {percent}%'
    matteFailed: 背景の削除に失敗しました。「背景を削除」をオフにするか、別の画像をお試しください。
