tools:
  audio-trimmer:
    title: 오디오 자르기
    description: 파형을 드래그해 구간을 선택하고 미리 들은 뒤 MP3 또는 WAV로 저장합니다. 모든 처리는 브라우저에서 이루어집니다.
    upload: 오디오 파일을 여기에 놓거나 클릭하여 선택
    tooLarge: '파일이 너무 큽니다(최대 {size} MB).'
    decodeFailed: '이 오디오 파일을 디코딩할 수 없습니다. MP3, WAV, OGG, M4A 또는 FLAC을 사용해 보세요.'
    decoding: 오디오 디코딩 중…
    start: 시작
    end: 끝
    selected: '선택됨: {length}'
    play: 선택 구간 재생
    stop: 정지
    chooseAnother: 파일 변경
    save: 클립 저장
    format: 형식
    bitrate: 비트레이트
    wavHint: WAV는 무손실이며 파일이 더 큽니다.
    cancel: 취소
    download: 다운로드
    encoding: 인코딩 중…
    encodeFailed: 오디오 내보내기에 실패했습니다.
    undo: 실행 취소
    redo: 다시 실행
    zoomIn: 확대
    zoomOut: 축소
    zoomSelection: 선택 구간 확대
    zoomFit: 전체 보기
    trimToSelection: 선택 구간만 남기기
    deleteSelection: 선택 구간 삭제
    total: '전체: {length}'
    hint: '파형을 드래그해 범위를 선택하고, 클릭하면 재생 위치가 이동합니다. 편집 내용은 오디오에 적용되며 저장하면 결과가 내보내집니다.'
    playAll: 재생
    pause: 일시정지
    resetSelection: 선택 해제
