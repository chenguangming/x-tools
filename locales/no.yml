  token-generator:
    title: Token-generator
    description: Generer en tilfeldig streng med store og/eller små bokstaver, siffer og/eller symboler etter eget valg.

    uppercase: Store bokstaver (ABC...)
    lowercase: Små bokstaver (abc...)
    numbers: Siffer (123...)
    symbols: Symboler (!-;...)
    length: Lengde
    tokenPlaceholder: Tokenet...
    copied: Tokenet er kopiert til utklippstavlen
    button:
      copy: Kopier
      refresh: Oppdater
  percentage-calculator:
    title: Prosentkalkulator
    description: Beregn enkelt prosenter fra en verdi til en annen, eller fra en prosent til en verdi.

  svg-placeholder-generator:
    title: SVG-plassholdergenerator
    description: Generer SVG-bilder som kan brukes som plassholdere i applikasjonene dine.

  json-to-csv:
    title: JSON til CSV
    description: Konverter JSON til CSV med automatisk gjenkjenning av overskrifter.

  camera-recorder:
    title: Kameraopptak
    description: Ta et bilde eller spill inn en video med webkamera eller kameraet ditt.

  keycode-info:
    title: Tastekode-info
    description: Finn JavaScript-tastekode, kode, plassering og modifikatorer for hvilken som helst tast du trykker.

  emoji-picker:
    title: Emoji-velger
    description: Kopier og lim inn emojier enkelt, og få Unicode- og kodepunktverdien til hver emoji.

  color-converter:
    title: Fargekonverter
    description: Konverter farger mellom de forskjellige formatene (hex, rgb, hsl og CSS-navn).

  bcrypt:
    title: Bcrypt
    description: Hash og sammenlign tekst med bcrypt. Bcrypt er en passordhashingfunksjon basert på Blowfish-chifferet.

  crontab-generator:
    title: Crontab-generator
    description: Valider og generer crontab, og få en lettlest beskrivelse av cron-tidsplanen.

  http-status-codes:
    title: HTTP-statuskoder
    description: Liste over alle HTTP-statuskoder, navnene deres og hva de betyr.

  sql-prettify:
    title: SQL-forskjønning og formatering
    description: Formater og forskjønn SQL-spørringene dine på nett (støtter flere SQL-dialekter).

  benchmark-builder:
    title: Referansetest-bygger
    description: Sammenlign enkelt kjøretiden til oppgaver med denne enkle referansetest-byggeren på nett.

  git-memo:
    title: Git-jukselapp
    description: Git er et desentralisert programvareverktøy for versjonskontroll. Med denne jukselappen får du rask tilgang til de vanligste Git-kommandoene.

  slugify-string:
    title: Slugify streng
    description: Gjør en streng trygg å bruke i URL-er, filnavn og id-er.

  encryption:
    title: Krypter / dekrypter tekst
    description: Krypter klartekst og dekrypter chiffertekst med krypteringsalgoritmer som AES, TripleDES, Rabbit eller RC4.

  random-port-generator:
    title: Tilfeldig portgenerator
    description: Generer tilfeldige portnumre utenfor området for «kjente» porter (0-1023).

  yaml-prettify:
    title: YAML-forskjønning og formatering
    description: Forskjønn YAML-strengen din til et lettlest format.

  eta-calculator:
    title: ETA-kalkulator
    description: En ETA-kalkulator (estimert ankomsttid) som beregner omtrent når en oppgave er ferdig, for eksempel sluttidspunktet og varigheten av en filnedlasting.

  roman-numeral-converter:
    title: Romertallkonverter
    description: Konverter romertall til tall og tall til romertall.

  hmac-generator:
    title: HMAC-generator
    description: Beregn en hashbasert meldingsautentiseringskode (HMAC) med en hemmelig nøkkel og din foretrukne hashfunksjon.

  bip39-generator:
    title: BIP39-passfrasegenerator
    description: Generer en BIP39-passfrase fra en eksisterende eller tilfeldig huskesetning, eller få huskesetningen ut fra passfrasen.

  base64-file-converter:
    title: Base64-filkonverter
    description: Konverter en streng, en fil eller et bilde til base64-representasjon.

  list-converter:
    title: Listekonverter
    description: Dette verktøyet kan behandle kolonnebaserte data og bruke ulike endringer (transponering, legge til prefiks og suffiks, reversere liste, sortere liste, gjøre om til små bokstaver, forkorte verdier) på hver rad.

  base64-string-converter:
    title: Base64-koding/dekoding av strenger
    description: Kod og dekod strenger enkelt til og fra base64-representasjon.

  toml-to-yaml:
    title: TOML til YAML
    description: Parser og konverter TOML til YAML.

  math-evaluator:
    title: Matematikkevaluator
    description: En kalkulator for å evaluere matematiske uttrykk. Du kan bruke funksjoner som sqrt, cos, sin, abs osv.

  json-to-yaml-converter:
    title: JSON til YAML-konverterer
    description: Konverter enkelt JSON til YAML med denne konverteren på nett.

  url-parser:
    title: URL-parser
    description: Del opp en URL i bestanddelene (protokoll, opprinnelse, parametere, port, brukernavn og passord, ...).

