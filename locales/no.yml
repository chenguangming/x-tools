    description: Endre store og små bokstaver i en streng, og velg mellom ulike formater.

  html-entities:
    title: Escape HTML-entiteter
    description: Escape eller unescape HTML-entiteter (erstatt tegn som <, >, &, " og ' med HTML-versjonen deres).

  json-prettify:
    title: JSON-forskjønning og formatering
    description: Forskjønn JSON-strengen din til et lettlest format.

  docker-run-to-docker-compose-converter:
    title: Docker run til Docker compose-konverter
    description: Konverter «docker run»-kommandoer til docker-compose-filer!

  mac-address-lookup:
    title: MAC-adresseoppslag
    description: Finn leverandør og produsent av en enhet ut fra MAC-adressen.

  mime-types:
    title: MIME-typer
    description: Konverter MIME-typer til filtyper (filendelser) og omvendt.

  toml-to-json:
    title: TOML til JSON
    description: Parser og konverter TOML til JSON.

