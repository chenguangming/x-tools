    title: IBAN-validering og -parser
    description: Valider og analyser IBAN-numre. Sjekk om et IBAN er gyldig, og få land, BBAN, om det er et QR-IBAN og IBAN i lesevennlig format.

  user-agent-parser:
    title: User-agent-parser
    description: Gjenkjenn og analyser nettleser, motor, OS, CPU og enhetstype/-modell fra en user-agent-streng.

  numeronym-generator:
    title: Numeronym-generator
    description: Et numeronym er et ord der et tall brukes til å lage en forkortelse. For eksempel er «i18n» et numeronym for «internasjonalisering», der 18 står for antall bokstaver mellom første i og siste n i ordet.

  case-converter:
