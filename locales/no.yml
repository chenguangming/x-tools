about:
  content: >
    # Om X-Tools

    X-Tools er en avledet versjon av Corentin Thomassets [IT-Tools](https://github.com/CorentinTh/it-tools) (stor takk til IT-Tools for det raust delte bidraget). Målet er å legge til flere verktøykategorier, slik at det ikke lenger er begrenset til IT-feltet. Hvis du synes det er nyttig, del det gjerne med vennene dine, og ikke glem å lage et bokmerke!

    X-Tools er åpen kildekode (under GPL-3.0-lisensen) og gratis, og vil alltid være det, men det koster penger å drifte og å fornye domenet. Hvis du ønsker å støtte arbeidet mitt og motivere meg til å legge til flere verktøy, kan du vurdere å støtte meg ved å [sponse meg](https://afdian.com/a/waying).

    ## Teknologier

    X-Tools er laget med Vue.js (Vue 3) og komponentbiblioteket Naive UI. Tredjeparts åpen kildekode-biblioteker brukes i noen verktøy. Du finner den komplette listen i filen [package.json](https://github.com/chenguangming/x-tools/blob/main/package.json) i depotet.

    ## Funnet en feil? Mangler det et verktøy?

    Hvis du trenger et verktøy som foreløpig ikke finnes her, og du tror det kan være nyttig, er du velkommen til å sende inn en funksjonsforespørsel i [problemseksjonen](https://github.com/chenguangming/x-tools/issues/new/choose) i [GitHub-depotet](https://github.com/chenguangming/x-tools).

    Og hvis du har funnet en feil, eller noe ikke fungerer som forventet, send gjerne inn en feilrapport i [problemseksjonen](https://github.com/chenguangming/x-tools/issues/new/choose) i GitHub-depotet.

    ## Personvern

    X-Tools bruker selvdrevet, anonym bruksstatistikk (sidevisninger, åpnede verktøy, favoritter, språk- og temaendringer og søkeord). Det brukes ingen informasjonskapsler, IP-adressen din lagres ikke, og du spores ikke på tvers av nettsteder. Favoritter og innstillinger lagres bare i nettleseren din. Du kan velge bort statistikken ved å slå på «Do Not Track» i nettleseren.

