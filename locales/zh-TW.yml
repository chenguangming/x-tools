about:
  content: >
    # 關於 X-Tools

    X-Tools 基於 Corentin Thomasset 的 [IT-Tools](https://github.com/CorentinTh/it-tools) 二次開發（感謝 IT-Tools 的無私貢獻），目標是增加工具種類，不再侷限於 IT 領域。如果對您有幫助，請將其分享給您的朋友，並且加入最愛！

    X-Tools 永久免費且遵守開源授權（GPL-3.0 授權條款），但需要資金用於代管和續約網域名稱。如果您想支持我的工作，並鼓勵我新增更多工具，請考慮透過 [贊助我](https://ko-fi.com/wayings) 來支持。

    ## 技術

    X-Tools 採用 Vue.js（Vue 3）和 Naive UI 元件庫開發，部分工具使用了第三方開源函式庫，您可以在儲存庫的 [package.json](https://github.com/chenguangming/x-tools/blob/main/package.json) 檔案中找到完整清單。

    ## 發現了 Bug？缺少工具？

    如果目前這裡沒有您需要的工具，並且您認為它可能有用，歡迎在 [GitHub 儲存庫](https://github.com/chenguangming/x-tools) 的 [issues](https://github.com/chenguangming/x-tools/issues/new/choose) 中提交新增功能的請求。

    如果您發現了 Bug，或者某些功能未能如預期運作，請在 GitHub 儲存庫的 [issues](https://github.com/chenguangming/x-tools/issues/new/choose) 中提交錯誤回報。

    ## 隱私說明

    X-Tools 使用自行託管的匿名使用統計（頁面瀏覽、開啟的工具、收藏、語言與主題切換以及搜尋關鍵字）。不使用 Cookie，不儲存您的 IP 位址，也不會跨站追蹤您。您的收藏與設定僅儲存在瀏覽器本機。如需退出統計，請在瀏覽器中開啟「不要追蹤」。

