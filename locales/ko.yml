about:
  content: >
    # X-Tools 소개

    X-Tools는 Corentin Thomasset의 [IT-Tools](https://github.com/CorentinTh/it-tools)에서 파생된 프로젝트입니다(IT-Tools의 아낌없는 기여에 깊이 감사드립니다). IT 분야에 국한되지 않고 더 다양한 종류의 도구를 추가하는 것을 목표로 합니다. 유용하다고 느끼셨다면 주변 친구들에게 공유하고 북마크하는 것도 잊지 마세요!

    X-Tools는 무료 오픈 소스(GPL-3.0 라이선스)이며 앞으로도 계속 그럴 것입니다. 다만 호스팅과 도메인 갱신에는 비용이 듭니다. 제 작업을 응원하고 더 많은 도구를 추가하도록 격려해 주시려면 [후원](https://ko-fi.com/wayings)을 고려해 주세요.

    ## 사용 기술

    X-Tools는 Vue.js(Vue 3)와 Naive UI 컴포넌트 라이브러리로 만들어졌습니다. 일부 도구에서는 서드파티 오픈 소스 라이브러리를 사용하며, 전체 목록은 저장소의 [package.json](https://github.com/chenguangming/x-tools/blob/main/package.json) 파일에서 확인할 수 있어요.

    ## 버그를 발견했나요? 필요한 도구가 없나요?

    현재 없는 도구가 필요하고 유용할 것 같다면, [GitHub 저장소](https://github.com/chenguangming/x-tools)의 [이슈 섹션](https://github.com/chenguangming/x-tools/issues/new/choose)에서 기능 요청을 남겨 주세요.

    버그를 발견했거나 예상과 다르게 동작하는 부분이 있다면, GitHub 저장소의 [이슈 섹션](https://github.com/chenguangming/x-tools/issues/new/choose)에 버그 리포트를 등록해 주세요.

    ## 개인정보

    X-Tools는 자체 호스팅한 익명 사용 통계(페이지 조회, 열어 본 도구, 즐겨찾기, 언어 및 테마 변경, 검색 키워드)를 사용합니다. 쿠키를 사용하지 않고 IP 주소를 저장하지 않으며 사이트 간 추적도 하지 않습니다. 즐겨찾기와 설정은 브라우저에만 저장됩니다. 통계를 거부하려면 브라우저에서 추적 방지(Do Not Track)를 켜세요.

