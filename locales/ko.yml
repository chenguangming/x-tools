    description: '비밀 값, IBAN, 토큰 같은 문자열을 난독화하여 내용을 드러내지 않으면서도 공유하고 식별할 수 있게 해요.'

  base-converter:
    title: 정수 진법 변환기
    description: '숫자를 다양한 진법(10진수, 16진수, 2진수, 8진수, base64 등) 간에 변환해요.'

  yaml-to-json-converter:
    title: YAML을 JSON으로 변환
    description: 온라인 실시간 변환기로 YAML을 JSON으로 간단히 변환해요.

  uuid-generator:
    title: UUID 생성기
    description: 'UUID(Universally Unique Identifier)는 컴퓨터 시스템에서 정보를 식별하는 데 쓰이는 128비트 숫자입니다. 가능한 UUID의 수는 16^32, 즉 2^128로 약 3.4x10^38개예요(정말 많죠!).'

  ipv4-address-converter:
    title: IPv4 주소 변환기
    description: 'IP 주소를 10진수, 2진수, 16진수 또는 IPv6 표현으로 변환해요.'

  text-statistics:
    title: 텍스트 통계
    description: '텍스트의 글자 수, 단어 수, 바이트 크기 등의 정보를 확인해요.'

  text-to-nato-alphabet:
    title: 텍스트를 NATO 음성 문자로 변환
    description: 구두 전달을 위해 텍스트를 NATO 음성 알파벳으로 변환해요.

  basic-auth-generator:
    title: Basic 인증 생성기
    description: 사용자 이름과 비밀번호로 base64 Basic 인증 헤더를 생성해요.

  text-to-unicode:
    title: 텍스트를 유니코드로 변환
    description: '텍스트를 유니코드로, 유니코드를 텍스트로 파싱하고 변환해요.'

  ipv4-range-expander:
    title: IPv4 범위 확장기
    description: 시작 및 끝 IPv4 주소를 입력하면 유효한 IPv4 서브넷과 CIDR 표기법을 계산해요.

  text-diff:
    title: 텍스트 비교
    description: 두 텍스트를 비교하여 차이점을 확인해요.

  otp-generator:
    title: OTP 코드 생성기
    description: 다중 인증을 위한 시간 기반 OTP(일회용 비밀번호)를 생성하고 검증해요.

  url-encoder:
    title: URL 형식 문자열 인코딩/디코딩
    description: 텍스트를 URL 인코딩(퍼센트 인코딩) 형식으로 인코딩하거나 디코딩해요.

  text-to-binary:
    title: 텍스트를 ASCII 2진수로 변환
    description: '텍스트를 ASCII 2진수 표현으로, 2진수를 텍스트로 변환해요.'
