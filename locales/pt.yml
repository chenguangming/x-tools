about:
  content: >
    # Sobre o X-Tools

    O X-Tools é um derivado do [IT-Tools](https://github.com/CorentinTh/it-tools) de Corentin Thomasset (muito obrigado ao IT-Tools pela generosa contribuição). Seu objetivo é adicionar mais categorias de ferramentas, sem se limitar à área de TI. Se você achar útil, fique à vontade para compartilhar com seus amigos e não esqueça de salvar nos favoritos!

    O X-Tools é gratuito e de código aberto (sob a licença GPL-3.0), e sempre será, mas custa dinheiro para hospedar e renovar o domínio. Se quiser apoiar meu trabalho e me incentivar a adicionar mais ferramentas, por favor considere [me patrocinar](https://ko-fi.com/wayings).

    ## Tecnologias

    O X-Tools é feito com Vue.js (Vue 3) e a biblioteca de componentes Naive UI. Bibliotecas de código aberto de terceiros são usadas em algumas ferramentas, e você pode encontrar a lista completa no arquivo [package.json](https://github.com/chenguangming/x-tools/blob/main/package.json) do repositório.

    ## Achou um bug? Está faltando uma ferramenta?

    Se você precisa de uma ferramenta que ainda não existe aqui e acha que pode ser útil, fique à vontade para enviar uma solicitação de recurso na [seção de issues](https://github.com/chenguangming/x-tools/issues/new/choose) do [repositório do GitHub](https://github.com/chenguangming/x-tools).

    E se você encontrar um bug, ou se algo não funcionar como esperado, por favor registre um relatório de bug na [seção de issues](https://github.com/chenguangming/x-tools/issues/new/choose) do repositório do GitHub.

    ## Privacidade

    O X-Tools usa estatísticas de uso anónimas e alojadas por nós (visualizações de página, ferramentas abertas, favoritos, alterações de idioma e tema, e palavras-chave de pesquisa). Não usa cookies, não guarda o seu endereço IP e não o rastreia entre sites. Os seus favoritos e definições ficam guardados apenas no seu navegador. Pode recusar ativando «Não rastrear» no navegador.

