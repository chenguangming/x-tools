about:
  content: >
    # X-Toolsについて

    X-Toolsは、Corentin Thomasset氏の[IT-Tools](https://github.com/CorentinTh/it-tools)から派生したプロジェクトです（IT-Toolsの多大な貢献に深く感謝いたします）。IT分野にとどまらず、より多くのカテゴリのツールを追加することを目指しています。便利だと感じたら、ぜひ友人に共有し、ブックマークもお忘れなく！

    X-Toolsは無料のオープンソース（GPL-3.0ライセンス）であり、今後もそれは変わりません。ただし、ホスティングやドメイン更新には費用がかかります。私の活動を支援し、さらにツールを追加する励みにしていただける方は、[スポンサー](https://afdian.com/a/waying)としてのご支援をご検討ください。

    ## 使用技術

    X-Toolsは、Vue.js（Vue 3）とNaive UIコンポーネントライブラリで作られています。一部のツールでは、サードパーティのオープンソースライブラリを使用しています。完全な一覧は、リポジトリの[package.json](https://github.com/chenguangming/x-tools/blob/main/package.json)ファイルをご覧ください。

    ## バグの報告・ツールのリクエスト

    現在ここにないツールで、役に立ちそうなものがあれば、[GitHubリポジトリ](https://github.com/chenguangming/x-tools)の[Issuesセクション](https://github.com/chenguangming/x-tools/issues/new/choose)で機能リクエストをお寄せください。

    また、バグを見つけた場合や期待どおりに動作しない場合は、GitHubリポジトリの[Issuesセクション](https://github.com/chenguangming/x-tools/issues/new/choose)でバグを報告してください。

    ## プライバシー

    X-Tools は、自社ホストの匿名の利用統計（ページ閲覧、開いたツール、お気に入り、言語とテーマの変更、検索キーワード）を使用しています。Cookie は使用せず、IP アドレスも保存せず、サイトをまたいだ追跡も行いません。お気に入りと設定はブラウザ内にのみ保存されます。統計を無効にするには、ブラウザで「トラッキング拒否（Do Not Track）」を有効にしてください。

