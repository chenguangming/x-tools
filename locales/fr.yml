about:
  content: >
    # À propos de X-Tools

    X-Tools est un dérivé d'[IT-Tools](https://github.com/CorentinTh/it-tools) de Corentin Thomasset (un grand merci à IT-Tools pour sa généreuse contribution). Il vise à ajouter davantage de catégories d'outils, sans se limiter au domaine informatique. Si vous le trouvez utile, n'hésitez pas à le partager avec vos amis et n'oubliez pas de l'ajouter à vos favoris !

    X-Tools est gratuit et open-source (sous licence GPL-3.0), et le restera toujours, mais l'hébergement et le renouvellement du nom de domaine coûtent de l'argent. Si vous voulez soutenir mon travail et m'encourager à ajouter plus d'outils, n'hésitez pas à me [soutenir](https://afdian.com/a/waying).

    ## Technologies

    X-Tools est réalisé avec Vue.js (Vue 3) et la bibliothèque de composants Naive UI. Des bibliothèques open-source tierces sont utilisées dans certains outils ; vous pouvez trouver la liste complète dans le fichier [package.json](https://github.com/chenguangming/x-tools/blob/main/package.json) du dépôt.

    ## Vous avez trouvé un bug ? Un outil manque ?

    Si vous avez besoin d'un outil qui n'est pas encore présent ici, et que vous pensez qu'il peut être utile, vous êtes invité à soumettre une demande de fonctionnalité dans la [section issues](https://github.com/chenguangming/x-tools/issues/new/choose) du [dépôt GitHub](https://github.com/chenguangming/x-tools).

    Et si vous avez trouvé un bug, ou si quelque chose ne fonctionne pas comme prévu, merci de créer un rapport de bug dans la [section issues](https://github.com/chenguangming/x-tools/issues/new/choose) du dépôt GitHub.

    ## Confidentialité

    X-Tools utilise des statistiques d'utilisation anonymes auto-hébergées (pages vues, outils ouverts, favoris, changements de langue et de thème, mots-clés de recherche). Aucun cookie n'est utilisé, votre adresse IP n'est pas conservée et vous n'êtes pas suivi d'un site à l'autre. Vos favoris et réglages sont stockés uniquement dans votre navigateur. Vous pouvez vous y opposer en activant « Ne pas suivre » dans votre navigateur.

