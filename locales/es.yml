about:
  content: >
    # Acerca de X-Tools

    X-Tools es un derivado de [IT-Tools](https://github.com/CorentinTh/it-tools) de Corentin Thomasset (muchas gracias a IT-Tools por su generosa contribución). Su objetivo es añadir más categorías de herramientas, sin limitarse ya al ámbito informático. Si le resulta útil, no dude en compartirlo con sus amigos y ¡no olvide guardarlo en marcadores!

    X-Tools es gratuito y de código abierto (bajo la licencia GPL-3.0), y siempre lo será, pero alojarlo y renovar el nombre de dominio cuesta dinero. Si desea apoyar mi trabajo y animarme a añadir más herramientas, considere apoyarme [patrocinándome](https://ko-fi.com/wayings).

    ## Tecnologías

    X-Tools está hecho con Vue.js (Vue 3) y la biblioteca de componentes Naive UI. Algunas herramientas utilizan bibliotecas de código abierto de terceros; puede encontrar la lista completa en el archivo [package.json](https://github.com/chenguangming/x-tools/blob/main/package.json) del repositorio.

    ## ¿Encontró un error? ¿Falta una herramienta?

    Si necesita una herramienta que actualmente no está aquí y cree que puede ser útil, puede enviar una solicitud de función en la [sección de issues](https://github.com/chenguangming/x-tools/issues/new/choose) del [repositorio de GitHub](https://github.com/chenguangming/x-tools).

    Y si encontró un error, o algo no funciona como se esperaba, presente un informe de error en la [sección de issues](https://github.com/chenguangming/x-tools/issues/new/choose) del repositorio de GitHub.

    ## Privacidad

    X-Tools utiliza estadísticas de uso anónimas y alojadas por nosotros (visitas de página, herramientas abiertas, favoritos, cambios de idioma y tema, y palabras clave de búsqueda). No usa cookies, no almacena su dirección IP y no le rastrea entre sitios. Sus favoritos y ajustes se guardan solo en su navegador. Puede excluirse activando «No rastrear» en su navegador.

