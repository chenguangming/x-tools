about:
  content: >
    # Про X-Tools

    X-Tools — це похідний проєкт від [IT-Tools](https://github.com/CorentinTh/it-tools) Корентена Томассе (щиро дякуємо IT-Tools за щедрий внесок). Він прагне додати більше категорій інструментів, не обмежуючись сферою IT. Якщо він вам корисний, діліться ним із друзями й не забудьте додати його до закладок!

    X-Tools є безкоштовним і відкритим (за ліцензією GPL-3.0) і завжди буде таким, але хостинг і продовження домену коштують грошей. Якщо ви хочете підтримати мою роботу та заохотити мене додавати більше інструментів, розгляньте можливість [спонсорувати мене](https://afdian.com/a/waying).

    ## Технології

    X-Tools створено на Vue.js (Vue 3) з бібліотекою компонентів Naive UI. У деяких інструментах використовуються сторонні відкриті бібліотеки, повний список яких ви можете знайти у файлі [package.json](https://github.com/chenguangming/x-tools/blob/main/package.json) репозиторію.

    ## Знайшли помилку? Бракує інструмента?

    Якщо вам потрібен інструмент, якого наразі тут немає, і ви вважаєте, що він може бути корисним, ви можете подати запит на нову функцію в [розділі issues](https://github.com/chenguangming/x-tools/issues/new/choose) [GitHub-репозиторію](https://github.com/chenguangming/x-tools).

    А якщо ви знайшли помилку або щось працює не так, як очікувалося, будь ласка, створіть звіт про помилку в [розділі issues](https://github.com/chenguangming/x-tools/issues/new/choose) GitHub-репозиторію.

    ## Конфіденційність

    X-Tools використовує власну анонімну статистику використання (перегляди сторінок, відкриті інструменти, обране, зміни мови й теми та пошукові запити). Файли cookie не використовуються, ваша IP-адреса не зберігається, а міжсайтове відстеження не виконується. Обране та налаштування зберігаються лише у вашому браузері. Щоб відмовитися, увімкніть «Do Not Track» у браузері.

