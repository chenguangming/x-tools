server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript;
    gzip_min_length 1024;

    # Background removal runtime and model, loaded lazily by the ID photo tool
    location /models/ {
        types {
            application/javascript mjs;
            application/wasm wasm;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
